[project]
name = "quorum-orchestrator"
version = "0.1.0"
description = "Bring-your-own-harness orchestration for long-running coding tasks: file-based, sandboxable, monitored."
readme = "README.md"
license = "MIT"
authors = [{ name = "Kevin Doherty" }]
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10,<4",
    "pydantic>=2",
    "typer>=0.12",
    "textual>=0.60",   # `quorum tui` ships by default; pure-Python, no server
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
tui = []   # the TUI is now a core dependency; kept so `quorum-orchestrator[tui]` still installs
nono = ["nono-py"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
quorum = "quorum.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quorum"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "nono_integration: real nono-py sandbox enforcement tests (need the [nono] extra and Landlock/Seatbelt support; self-skip elsewhere)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["B008"]  # typer.Option in defaults is the framework's idiom

[tool.ruff.lint.per-file-ignores]
"tests/test_web.py" = ["E402"]  # imports must follow pytest.importorskip
"tests/test_nono_integration.py" = ["E402"]  # imports must follow pytest.importorskip
