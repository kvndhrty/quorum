[project]
name = "quorum"
version = "0.1.0"
description = "An agentic ecosystem of specialists: always-on, file-based agents for busy researchers."
readme = "README.md"
license = "MIT"
authors = [{ name = "Kevin Doherty" }]
requires-python = ">=3.11"
dependencies = [
    "apscheduler>=3.10,<4",
    "pydantic>=2",
    "typer>=0.12",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
tui = ["textual>=0.60"]
nono = ["nono-py"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
quorum = "quorum.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quorum"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
